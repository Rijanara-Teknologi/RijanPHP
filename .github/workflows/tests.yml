name: Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        db-connection: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: rijanphp_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rijanphp_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
        coverage: xdebug
    
    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist
    
    - name: Run tests
      env:
        DB_CONNECTION: ${{ matrix.db-connection }}
        DB_HOST: 127.0.0.1
        DB_PORT: ${{ matrix.db-connection == 'mysql' && 3306 || matrix.db-connection == 'pgsql' && 5432 || '' }}
        DB_DATABASE: ${{ matrix.db-connection == 'sqlite' && ':memory:' || 'rijanphp_test' }}
        DB_USERNAME: ${{ matrix.db-connection == 'mysql' && 'root' || matrix.db-connection == 'pgsql' && 'postgres' || '' }}
        DB_PASSWORD: password
      run: vendor/bin/phpunit --coverage-clover coverage.xml
    
    - name: Run manual tests
      run: php tests_manual/run.php

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
