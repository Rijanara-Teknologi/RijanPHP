name: Stable Branch Cleanup

on:
  push:
    branches: [ stable ]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Cleanup non-core files
        run: |
          rm -rf tests/
          rm -rf storage/
          rm -f composer.lock
          rm -f Makefile
          rm -f phpunit.xml
          rm -f .env.test
          rm -rf .github/workflows/tests.yml

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: cleanup non-core files for stable branch"
            git push origin HEAD:stable
          else
            echo "No changes to commit"
          fi
