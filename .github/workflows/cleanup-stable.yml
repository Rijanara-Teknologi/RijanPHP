name: Stable Branch Cleanup

on:
  push:
    branches: [ stable ]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.CLEANUP_TOKEN }}
          fetch-depth: 0

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep "final public const VERSION" Core/Rijan.php | cut -d"'" -f2)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      - name: Cleanup non-core files
        run: |
          rm -rf tests/
          rm -rf tests_manual/
          rm -rf storage/
          rm -rf Master/Views/
          rm -rf Master/Seeds/TestSeeder.php
          rm -rf Modules/Product/
          rm -f composer.lock
          rm -f Makefile
          rm -f phpunit.xml
          rm -f .env.test
          rm -f Master/Migrations/0002_create_products_table.php
          rm -f Master/Migrations/0003_create_orders_table.php
          rm -rf .github/workflows/tests.yml

      - name: Commit and push cleanup
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: cleanup non-core files for stable branch"
            git push origin HEAD:stable --force
          else
            echo "No changes to commit"
          fi

      - name: Create Tag and Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            Automated production release for RijanPHP.
            - Clean core framework files only.
            - Professional error handling and pages.
            - Stable branch synchronization.
          generate_release_notes: true
          token: ${{ secrets.CLEANUP_TOKEN }}
